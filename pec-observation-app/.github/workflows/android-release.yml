name: Android Release — Play Store

on:
  push:
    tags:
      - "android-v*"     # e.g. android-v1.0.0 → Internal Testing
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane"
        required: true
        default: "ci_internal"
        type: choice
        options:
          - ci_internal
          - beta
          - release

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Test
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: pec-observation-app/android-app

  release:
    name: Build & Upload to Play Store
    runs-on: ubuntu-latest
    needs: test

    env:
      KEYSTORE_FILE:     ${{ runner.temp }}/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json
      SLACK_WEBHOOK:     ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: pec-observation-app/android-app

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"

      - name: Decode Play Store key
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 --decode > "$PLAY_STORE_JSON_KEY_FILE"

      - name: Determine lane
        id: lane
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "lane=ci_internal" >> "$GITHUB_OUTPUT"
          else
            echo "lane=${{ github.event.inputs.lane }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Fastlane
        run: bundle exec fastlane ${{ steps.lane.outputs.lane }}
        working-directory: pec-observation-app/android-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-aab-${{ github.sha }}
          path: pec-observation-app/android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  promote-to-production:
    name: Promote → Production (staged 10%)
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/android-v')
    environment: production

    env:
      PLAY_STORE_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: pec-observation-app/android-app

      - name: Decode Play Store key
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 --decode > "$PLAY_STORE_JSON_KEY_FILE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"

      - name: Promote to production
        run: bundle exec fastlane release version:${{ steps.version.outputs.version }}
        working-directory: pec-observation-app/android-app
