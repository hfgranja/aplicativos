name: Deploy → Produção

on:
  push:
    branches: [main]
    paths:
      - "pec-observation-app/services/**"
      - "pec-observation-app/shared/**"
      - "pec-observation-app/web-app/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Deploy serviço específico (vazio = todos — CUIDADO)"
        required: false
        default: ""

env:
  PROJECT_ID:  ${{ secrets.GCP_PROJECT_ID_PROD }}
  REGION:      southamerica-east1
  APP_NAME:    pec-obs
  REGISTRY:    southamerica-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/pec-obs

jobs:
  # ── Security Scan Final ─────────────────────────────────────────────────────
  security-scan:
    name: Security Scan Final (Trivy + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan — bloqueante em CRITICAL e HIGH
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: pec-observation-app/
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-prod.sarif

      - name: SBOM produção
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: pec-observation-app/
          format: cyclonedx
          output: sbom-prod.json

      - name: Upload evidências de segurança
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            trivy-prod.sarif
            sbom-prod.json

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build Images (Prod)
    runs-on: ubuntu-22.04
    needs: security-scan
    environment: production             # ← GATE: 1 aprovação obrigatória + 5min delay
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build all services (paralelo)
        run: |
          set -e
          SERVICES="ms-001-identity ms-002-school ms-003-observation ms-004-audio-ingestion ms-005-transcription ms-006-ai-feedback ms-007-feedback ms-008-pdf-export ms-009-audit ms-010-consent ms-011-knowledge ms-012-best-practices ms-013-learning ms-014-evaluator ms-015-mcp"
          for svc in $SERVICES; do
            docker build \
              -t "${{ env.REGISTRY }}/${svc}:${{ github.sha }}" \
              -f "services/${svc}/Dockerfile" \
              --cache-from "${{ env.REGISTRY }}/${svc}:latest-stable" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              . &
          done
          docker build \
            -t "${{ env.REGISTRY }}/web-app:${{ github.sha }}" \
            web-app &
          wait
        working-directory: pec-observation-app
        env:
          DOCKER_BUILDKIT: "1"

      - name: Push images (SHA imutável — sem :latest em prod)
        run: |
          SERVICES="ms-001-identity ms-002-school ms-003-observation ms-004-audio-ingestion ms-005-transcription ms-006-ai-feedback ms-007-feedback ms-008-pdf-export ms-009-audit ms-010-consent ms-011-knowledge ms-012-best-practices ms-013-learning ms-014-evaluator ms-015-mcp web-app"
          for svc in $SERVICES; do
            docker push "${{ env.REGISTRY }}/${svc}:${{ github.sha }}" &
          done
          wait

  # ── Deploy Sequencial por Fase ──────────────────────────────────────────────
  # Fase 1: Auth
  deploy-phase-1:
    name: "Deploy Fase 1: Identity"
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ms-001-identity
        run: |
          gcloud run deploy "${{ env.APP_NAME }}-ms-001-identity" \
            --image="${{ env.REGISTRY }}/ms-001-identity:${{ needs.build.outputs.image_tag }}" \
            --region="${{ env.REGION }}" --platform=managed --quiet
          # Health check após deploy
          URL=$(gcloud run services describe "${{ env.APP_NAME }}-ms-001-identity" \
            --region="${{ env.REGION }}" --format="value(status.url)")
          for i in {1..12}; do
            curl -sf "${URL}/health" && break || sleep 10
          done

  # Fase 2: Core services (paralelo)
  deploy-phase-2:
    name: "Deploy Fase 2: Core Services"
    runs-on: ubuntu-latest
    needs: [build, deploy-phase-1]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ms-002 a ms-010
        run: |
          for svc in ms-002-school ms-003-observation ms-004-audio-ingestion ms-009-audit ms-010-consent; do
            gcloud run deploy "${{ env.APP_NAME }}-${svc}" \
              --image="${{ env.REGISTRY }}/${svc}:${{ needs.build.outputs.image_tag }}" \
              --region="${{ env.REGION }}" --platform=managed --quiet &
          done
          wait

  # Fase 3: AI pipeline
  deploy-phase-3:
    name: "Deploy Fase 3: AI Pipeline"
    runs-on: ubuntu-latest
    needs: [build, deploy-phase-2]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ms-005 a ms-015 + web-app
        run: |
          for svc in ms-005-transcription ms-006-ai-feedback ms-007-feedback ms-008-pdf-export \
                     ms-011-knowledge ms-012-best-practices ms-013-learning ms-014-evaluator \
                     ms-015-mcp web-app; do
            gcloud run deploy "${{ env.APP_NAME }}-${svc}" \
              --image="${{ env.REGISTRY }}/${svc}:${{ needs.build.outputs.image_tag }}" \
              --region="${{ env.REGION }}" --platform=managed --quiet &
          done
          wait

  # ── Verificação final + Rollback automático ──────────────────────────────────
  verify-or-rollback:
    name: Verificação Final + Rollback se necessário
    runs-on: ubuntu-latest
    needs: [build, deploy-phase-1, deploy-phase-2, deploy-phase-3]
    environment: production
    if: always()
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Health checks
        id: healthcheck
        run: |
          FAILED=0
          for svc in ms-001-identity ms-003-observation ms-007-feedback; do
            URL=$(gcloud run services describe "${{ env.APP_NAME }}-${svc}" \
              --region="${{ env.REGION }}" --format="value(status.url)" 2>/dev/null || echo "")
            if [[ -n "$URL" ]]; then
              curl -sf "${URL}/health" || { echo "FALHA: $svc"; FAILED=$((FAILED+1)); }
            fi
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Rollback automático se health falhou
        if: steps.healthcheck.outputs.failed != '0'
        run: |
          echo "Aviso: Health checks falharam — iniciando rollback automático"
          for svc in ms-001-identity ms-002-school ms-003-observation ms-004-audio-ingestion \
                     ms-009-audit ms-010-consent ms-007-feedback; do
            gcloud run services update-traffic "${{ env.APP_NAME }}-${svc}" \
              --to-revisions=PREVIOUS=100 --region="${{ env.REGION }}" --quiet || true &
          done
          wait
          echo "Rollback concluído. Verifique os logs manualmente."
          exit 1

      - name: Sumário do deploy
        if: steps.healthcheck.outputs.failed == '0'
        run: |
          WEB_URL=$(gcloud run services describe "${{ env.APP_NAME }}-web-app" \
            --region="${{ env.REGION }}" --format="value(status.url)" 2>/dev/null || echo "N/A")
          echo "Deploy produção concluído com sucesso"
          echo "SHA: ${{ github.sha }}"
          echo "Web App: $WEB_URL"
          echo "Monitoramento: https://console.cloud.google.com/monitoring?project=${{ env.PROJECT_ID }}"
