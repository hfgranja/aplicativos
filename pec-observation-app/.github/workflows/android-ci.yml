name: Android CI

on:
  pull_request:
    paths:
      - "pec-observation-app/android-app/**"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: pec-observation-app/android-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: pec-observation-app/android-app/app/build/reports/tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: pec-observation-app/android-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: pec-observation-app/android-app/app/build/reports/lint-results-debug.html

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: pec-observation-app/android-app

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: pec-observation-app/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
