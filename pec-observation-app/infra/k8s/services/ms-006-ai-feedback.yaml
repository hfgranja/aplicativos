apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-006-ai-feedback
  namespace: pec-observation
  labels:
    app: ms-006-ai-feedback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-006-ai-feedback
  template:
    metadata:
      labels:
        app: ms-006-ai-feedback
    spec:
      containers:
        - name: ms-006-ai-feedback
          image: REGISTRY_PLACEHOLDER/ms-006-ai-feedback:latest
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: pec-common-config
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://pec_ai_feedback:$(DB_PASSWORD)@postgres/pec_ai_feedback
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pec-secrets
                  key: db-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pec-secrets
                  key: jwt-secret-key
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pec-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pec-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-006-ai-feedback
  namespace: pec-observation
spec:
  selector:
    app: ms-006-ai-feedback
  ports:
    - port: 8006
      targetPort: 8006
