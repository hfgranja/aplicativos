# PEC Observation App — API Gateway
# Serves static web-app and reverse-proxies all microservices.
# All API URLs in the web-app are relative (/api/v1/...) so no CORS is needed.

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr  zone=api:10m     rate=60r/m;
limit_req_zone  $binary_remote_addr  zone=auth:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=upload:10m  rate=5r/m;

# ── Upstreams ────────────────────────────────────────────────────────────────
upstream identity      { server ms-001-identity:8000;      keepalive 4; }
upstream school        { server ms-002-school:8000;         keepalive 4; }
upstream observation   { server ms-003-observation:8000;    keepalive 4; }
upstream audio         { server ms-004-audio-ingestion:8000; keepalive 4; }
upstream transcription { server ms-005-transcription:8000;  keepalive 2; }
upstream ai_feedback   { server ms-006-ai-feedback:8000;    keepalive 2; }
upstream feedback      { server ms-007-feedback:8000;       keepalive 4; }
upstream pdf           { server ms-008-pdf-export:8000;     keepalive 2; }
upstream audit         { server ms-009-audit:8000;          keepalive 2; }
upstream consent       { server ms-010-consent:8000;        keepalive 2; }
upstream knowledge     { server ms-011-knowledge:8000;      keepalive 4; }
upstream bestpractices { server ms-012-best-practices:8000; keepalive 4; }
upstream learning      { server ms-013-learning:8000;       keepalive 2; }
upstream evaluator     { server ms-014-evaluator:8000;      keepalive 2; }
upstream mcp_server    { server ms-015-mcp:8000;            keepalive 4; }

# ── Proxy defaults ───────────────────────────────────────────────────────────
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_read_timeout  60s;
proxy_connect_timeout 10s;

# ── Gzip ─────────────────────────────────────────────────────────────────────
gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml image/svg+xml;
gzip_min_length 512;
gzip_vary on;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options             "DENY"                                                                                                          always;
    add_header X-Content-Type-Options      "nosniff"                                                                                                       always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"                                                                               always;
    add_header X-XSS-Protection            "0"                                                                                                             always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload"                                                                  always;
    add_header Permissions-Policy          "microphone=(), camera=(), geolocation=(), payment=(), usb=(), serial=()"                                       always;
    add_header X-Permitted-Cross-Domain-Policies "none"                                                                                                    always;
    add_header Cross-Origin-Embedder-Policy      "require-corp"                                                                                            always;
    add_header Cross-Origin-Opener-Policy        "same-origin"                                                                                             always;
    add_header Cross-Origin-Resource-Policy      "same-origin"                                                                                             always;

    client_max_body_size 50M;

    # ── Gateway health ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ── Auth (stricter rate limit) ───────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://identity;
    }
    location /api/v1/users/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://identity;
    }

    # ── Schools & Teachers ───────────────────────────────────────────────────
    location /api/v1/schools/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://school;
    }
    location /api/v1/teachers/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://school;
    }

    # ── Observations ─────────────────────────────────────────────────────────
    location /api/v1/observations/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://observation;
    }

    # ── Audio (larger upload, stricter rate) ─────────────────────────────────
    location /api/v1/audio/ {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 200M;
        proxy_read_timeout 120s;
        proxy_pass http://audio;
    }

    # ── Transcriptions ───────────────────────────────────────────────────────
    location /api/v1/transcriptions/ {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 300s;
        proxy_pass http://transcription;
    }

    # ── AI Feedback ──────────────────────────────────────────────────────────
    location /api/v1/ai-feedback/ {
        limit_req zone=api burst=5 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://ai_feedback;
    }

    # ── Human Feedback ───────────────────────────────────────────────────────
    location /api/v1/feedback/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://feedback;
    }

    # ── PDF Export ───────────────────────────────────────────────────────────
    location /api/v1/pdf/ {
        limit_req zone=api burst=5 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://pdf;
    }

    # ── Audit ────────────────────────────────────────────────────────────────
    location /api/v1/audit/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://audit;
    }

    # ── Consent & DSAR (LGPD) ────────────────────────────────────────────────
    location /api/v1/consent/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://consent;
    }
    location /api/v1/dsar/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://consent;
    }

    # ── Knowledge Base ───────────────────────────────────────────────────────
    location /api/v1/knowledge/ {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://knowledge;
    }
    location /api/v1/crawler/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://knowledge;
    }

    # ── Best Practices (video upload can be large) ───────────────────────────
    location /api/v1/best-practices/ {
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://bestpractices;
    }

    # ── Learning Engine (internal — admin only) ─────────────────────────────
    location /api/v1/learning/ {
        limit_req zone=api burst=5 nodelay;
        proxy_read_timeout 300s;
        proxy_pass http://learning;
    }

    # ── Model Evaluator ──────────────────────────────────────────────────────
    location /api/v1/evaluator/ {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://evaluator;
    }

    # ── MCP Server (normas, regras e dados de treinamento) ───────────────────
    # Streamable-HTTP MCP endpoint — compatível com Claude Desktop e Claude Code
    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 120s;
        # SSE requires disabling proxy buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_pass http://mcp_server;
    }

    # ── Per-service health endpoints (internal monitoring) ───────────────────
    location ~ ^/internal/health/(?<svc>[a-z0-9-]+)$ {
        internal;
        proxy_pass http://$svc/health;
    }

    # ── Static web-app (SPA) ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
