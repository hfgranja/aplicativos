# PEC Observation App — Production Docker Compose
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Key differences from dev (docker-compose.yml):
#   • Build context is the project root so shared/ is reachable in all images
#   • Uvicorn: no --reload, 2 workers (1 for CPU-bound services)
#   • Microservice ports NOT exposed to host — all traffic via api-gateway
#   • api-gateway = nginx that serves the React SPA + routes /api/v1/*
#   • restart: unless-stopped everywhere
#   • Resource limits on heavy services

version: "3.9"

# ── Reusable fragments ────────────────────────────────────────────────────────
x-svc: &svc
  restart: unless-stopped
  networks: [pec-network]
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: "5" }

x-pybase: &pybase
  image: python:3.12-slim
  apt: build-essential libpq-dev curl

networks:
  pec-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    <<: *svc
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       pec_identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    <<: *svc
    image: redis:7-alpine
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *svc
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    <<: *svc
    restart: "no"
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    volumes: [./infra/minio/create-buckets.sh:/create-buckets.sh]
    entrypoint: /bin/sh /create-buckets.sh
    environment:
      MINIO_ENDPOINT:      http://minio:9000
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  ollama:
    <<: *svc
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    <<: *svc
    restart: "no"
    image: ollama/ollama:latest
    depends_on:
      ollama: {condition: service_healthy}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh -c "
      ollama pull ${OLLAMA_MODEL:-llama3.2} &&
      ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} &&
      echo 'Models ready'
    "
    environment:
      OLLAMA_HOST: http://ollama:11434

  # ── Microservices ───────────────────────────────────────────────────────────

  ms-001-identity:
    <<: *svc
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends \
            build-essential libpq-dev curl && rm -rf /var/lib/apt/lists/*
        COPY shared /shared
        RUN pip install --no-cache-dir -e /shared
        COPY services/ms-001-identity/requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY services/ms-001-identity/app ./app
        ENV PYTHONUNBUFFERED=1
        CMD ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--workers","2","--log-level","warning"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pec_identity
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

