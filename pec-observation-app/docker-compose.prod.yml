  api-gateway:
    <<: *svc
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile.gateway
    ports:
      - "80:80"
    depends_on:
      ms-001-identity:       {condition: service_healthy}
      ms-002-school:         {condition: service_healthy}
      ms-003-observation:    {condition: service_healthy}
      ms-004-audio-ingestion:{condition: service_healthy}
