      ms-012-best-practices: {condition: service_healthy}
      ms-013-learning:       {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
