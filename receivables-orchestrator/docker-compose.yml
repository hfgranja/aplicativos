services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/receivables.db
      FRONTEND_ORIGIN: http://localhost:5173
      SIM_MIN_RESOLUTION_SECONDS: ${SIM_MIN_RESOLUTION_SECONDS:-2}
      SIM_MAX_RESOLUTION_SECONDS: ${SIM_MAX_RESOLUTION_SECONDS:-6}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  frontend_node_modules:
