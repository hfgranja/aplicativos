services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/agroprofit.db
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      ALLOW_NON_COMMERCIAL_PROVIDERS: ${ALLOW_NON_COMMERCIAL_PROVIDERS:-true}
      ENABLE_EARTH_ENGINE: ${ENABLE_EARTH_ENGINE:-false}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      PLANET_API_KEY: ${PLANET_API_KEY:-}
      CDS_API_KEY: ${CDS_API_KEY:-}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  frontend_node_modules:
