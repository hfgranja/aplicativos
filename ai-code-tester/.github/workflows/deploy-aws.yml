name: Deploy — AWS (us-east-1)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: ait-aws-us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
  SERVICES: "analysis-service advisory-service git-proxy storage-service cell-health frontend"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all images
        run: |
          for SERVICE in $SERVICES; do
            docker buildx build \
              --file apps/$SERVICE/Dockerfile \
              --tag $ECR_REGISTRY/ait/$SERVICE:$IMAGE_TAG \
              --push \
              --cache-from type=registry,ref=$ECR_REGISTRY/ait/$SERVICE:cache \
              --cache-to type=registry,ref=$ECR_REGISTRY/ait/$SERVICE:cache,mode=max \
              .
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy with Kustomize
        run: |
          cd infra/k8s/overlays/aws
          kustomize edit set image \
            analysis-service=$ECR_REGISTRY/ait/analysis-service:$IMAGE_TAG \
            advisory-service=$ECR_REGISTRY/ait/advisory-service:$IMAGE_TAG \
            git-proxy=$ECR_REGISTRY/ait/git-proxy:$IMAGE_TAG \
            storage-service=$ECR_REGISTRY/ait/storage-service:$IMAGE_TAG \
            cell-health=$ECR_REGISTRY/ait/cell-health:$IMAGE_TAG \
            frontend=$ECR_REGISTRY/ait/frontend:$IMAGE_TAG
          kubectl apply -k .
          kubectl rollout status deployment -n ait-aws-us-east-1 --timeout=300s

      - name: Smoke test
        run: |
          INGRESS_URL=$(kubectl get ingress -n ait-aws-us-east-1 -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
          echo "Testing cell health at http://$INGRESS_URL/health"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf http://$INGRESS_URL/health | jq -r '.status' 2>/dev/null || echo "error")
            if [ "$STATUS" = "healthy" ]; then
              echo "Cell is healthy"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed after 10 attempts"
          exit 1
