apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ait-azure-eastus

resources:
  - ../../base

namePrefix: azure-

patches:
  - target:
      kind: ConfigMap
      name: azure-cell-config
    patch: |-
      - op: replace
        path: /data/cell_id
        value: azure-eastus
      - op: replace
        path: /data/cloud_provider
        value: azure

  - target:
      kind: Ingress
      name: azure-ait-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          kubernetes.io/ingress.class: azure/application-gateway
          appgw.ingress.kubernetes.io/health-probe-path: /health

images:
  - name: analysis-service
    newName: "$(ACR_NAME).azurecr.io/ait/analysis-service"
    newTag: "$(IMAGE_TAG)"
  - name: advisory-service
    newName: "$(ACR_NAME).azurecr.io/ait/advisory-service"
    newTag: "$(IMAGE_TAG)"
  - name: git-proxy
    newName: "$(ACR_NAME).azurecr.io/ait/git-proxy"
    newTag: "$(IMAGE_TAG)"
  - name: storage-service
    newName: "$(ACR_NAME).azurecr.io/ait/storage-service"
    newTag: "$(IMAGE_TAG)"
  - name: cell-health
    newName: "$(ACR_NAME).azurecr.io/ait/cell-health"
    newTag: "$(IMAGE_TAG)"
  - name: frontend
    newName: "$(ACR_NAME).azurecr.io/ait/frontend"
    newTag: "$(IMAGE_TAG)"
