apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ait-ingress
  namespace: ait
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/analyze
            pathType: Prefix
            backend:
              service:
                name: analysis-service
                port:
                  number: 3001
          - path: /api/v1/suggest
            pathType: Prefix
            backend:
              service:
                name: advisory-service
                port:
                  number: 3002
          - path: /api/v1/git
            pathType: Prefix
            backend:
              service:
                name: git-proxy
                port:
                  number: 3003
          - path: /api/v1/analyses
            pathType: Prefix
            backend:
              service:
                name: storage-service
                port:
                  number: 3004
          - path: /api/v1/incidents
            pathType: Prefix
            backend:
              service:
                name: storage-service
                port:
                  number: 3004
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cell-health
                port:
                  number: 3005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
