apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: ait
  labels:
    app: storage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
        - name: storage-service
          image: storage-service:latest
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: NODE_ENV
              value: production
            - name: CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: cell-config
                  key: cloud_provider
          envFrom:
            - secretRef:
                name: storage-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 10
