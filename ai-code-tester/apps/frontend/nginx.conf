server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to cell services (nginx handles routing per overlay)
    location /api/v1/analyze {
        proxy_pass http://analysis-service:3001;
        proxy_set_header Host $host;
    }
    location /api/v1/suggest {
        proxy_pass http://advisory-service:3002;
        proxy_set_header Host $host;
    }
    location /api/v1/git/ {
        proxy_pass http://git-proxy:3003;
        proxy_set_header Host $host;
    }
    location /api/v1/analyses {
        proxy_pass http://storage-service:3004;
        proxy_set_header Host $host;
    }
    location /api/v1/incidents {
        proxy_pass http://storage-service:3004;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://cell-health:3005;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
